; HomeGlow Bridge: one per home. Holds the cloud connection and talks to the WLED controllers locally.
; Board: ESP32-S3 DevKitC-1 N16R8 (16 MB flash, 8 MB octal PSRAM).
[env:bridge_s3_n16r8]
platform = espressif32 @ 6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs
monitor_speed = 115200
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DMQTT_MAX_PACKET_SIZE=4096
  -DCORE_DEBUG_LEVEL=1
  -DMINIZ_NO_STDIO
  -DMINIZ_NO_TIME
  -DMINIZ_NO_ARCHIVE_APIS
  -DMINIZ_NO_ZLIB_COMPATIBLE_NAMES
  ; miniz under its own names: the ESP32-S3 ROM has an older miniz whose tinfl state differs
  -Dtinfl_decompress=hgz_tinfl_decompress
  -Dtinfl_decompress_mem_to_heap=hgz_tinfl_decompress_mem_to_heap
  -Dtinfl_decompress_mem_to_mem=hgz_tinfl_decompress_mem_to_mem
  -Dtinfl_decompress_mem_to_callback=hgz_tinfl_decompress_mem_to_callback
  -Dtdefl_init=hgz_tdefl_init
  -Dtdefl_compress=hgz_tdefl_compress
  -Dtdefl_compress_buffer=hgz_tdefl_compress_buffer
  -Dtdefl_get_prev_return_status=hgz_tdefl_get_prev_return_status
  -Dtdefl_get_adler32=hgz_tdefl_get_adler32
  -Dtdefl_compress_mem_to_output=hgz_tdefl_compress_mem_to_output
  -Dtdefl_compress_mem_to_heap=hgz_tdefl_compress_mem_to_heap
  -Dtdefl_compress_mem_to_mem=hgz_tdefl_compress_mem_to_mem
  -Dtdefl_create_comp_flags_from_zip_params=hgz_tdefl_create_comp_flags_from_zip_params
  -Dmz_adler32=hgz_mz_adler32
  -Dmz_crc32=hgz_mz_crc32
lib_deps =
  knolleary/PubSubClient @ 2.8
  bblanchon/ArduinoJson @ 7.2.1
  tzapu/WiFiManager @ 2.0.17
