name: WLED Release CI

# HomeGlow: started from the Actions tab ("Run workflow") with the release tag to create.
# Builds every ESP32-family board and uploads them to a DRAFT release; publishing the
# draft (by hand, on GitHub) creates the tag and makes it visible to HomeGlow.
on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. v16.0.1-hg2)'
        required: true
        default: 'v16.0.1-hg2'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:

  wled_build:
    uses: ./.github/workflows/build.yml
    with:
      release: true

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: wled_build
    steps:
    - uses: actions/checkout@v4
      with:
        sparse-checkout: |
          HOMEGLOW.md
          .github/homeglow.json
        sparse-checkout-cone-mode: false
    - uses: actions/download-artifact@v4
      with:
        path: release
        merge-multiple: true
    - name: Add HomeGlow manifest, drop leftovers from earlier versions
      run: |
        cp .github/homeglow.json release/homeglow.json
        VER=$(jq -r .version .github/homeglow.json)
        find release -name '*.bin' ! -name "WLED_${VER}_*" -print -delete
        ls release
    - name: Create draft release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ inputs.tag || github.ref_name }}
        target_commitish: ${{ github.sha }}
        name: WLED ${{ inputs.tag || github.ref_name }} (16.0.1 + HomeGlow fixes)
        body_path: HOMEGLOW.md
        draft: true
        files: |
          release/*.bin
          release/homeglow.json
